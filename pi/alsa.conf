# Application-local ALSA config; never replaces ~/.asoundrc or system defaults.
</usr/share/alsa/alsa.conf>

# JV801 capture is natively 48 kHz; plug converts rate/channels for our 16 kHz
# mono stream and stereo speaker. Resolve the stable ALSA CARD name, not index.
pcm.bart_JV801 {
    type plug
    slave.pcm "hw:CARD=JV801,DEV=0"
    hint {
        show on
        description "Bart JV801 rate-converting USB audio"
    }
}
